name: GhostFrame Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - ghostframe-source.b64
      - .github/workflows/ghostframe-android.yml
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game and generate tactical assets
        run: |
          set -e
          apt-get update -qq
          apt-get install -y -qq xz-utils python3-pip
          base64 -d ghostframe-source.b64 > ghostframe-source.tar.xz
          tar -xJf ghostframe-source.tar.xz
          python3 -m pip install --quiet numpy trimesh
          python3 tools/build_soldiers_glb.py
          python3 tools/enhance_soldiers.py
          python3 tools/make_audio.py
      - name: Import project and validate Godot scripts
        run: |
          set -o pipefail
          mkdir -p dist
          HOME=/root godot --headless --path godot --editor --quit --verbose 2>&1 | tee dist/import.log
          HOME=/root godot --headless --path godot --quit-after 5 2>&1 | tee dist/runtime.log
          if grep -Ei "SCRIPT ERROR|Parse Error|Failed to load script" dist/import.log dist/runtime.log; then exit 1; fi
      - name: Export signed Android debug APK
        run: |
          set -o pipefail
          HOME=/root godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/dist/GHOSTFRAME-debug.apk" 2>&1 | tee dist/export.log
          test -s dist/GHOSTFRAME-debug.apk
          unzip -tqq dist/GHOSTFRAME-debug.apk
          sha256sum dist/GHOSTFRAME-debug.apk > dist/SHA256SUMS.txt
      - name: Upload logs and test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GhostFrame-Android-Test-Build
          path: dist/
          if-no-files-found: warn
          retention-days: 14
